min_version = '2026.8.0'

[tools]
python = '3.12'
node = '22'
npm = '10.9.8'

[env]
_.python.venv = { path = '.venv', create = true }
PYTHONPATH = 'src'

[settings]
lockfile = true
task.run_auto_install = false

[tasks.setup]
description = 'Install Python and Node dependencies'
tools = { python = '3.12', node = '22', npm = '10.9.8' }
run = [
  'python -m pip install --upgrade pip',
  'python -m pip install -r requirements-dev.txt',
  'npm ci',
]

[tasks.run]
description = 'Run OhMyMeme from source'
tools = { python = '3.12' }
run = 'python -m ohmymeme'

[tasks.test]
description = 'Run the Python test suite'
tools = { python = '3.12' }
run = 'python -m pytest tests/ -v'

[tasks.test-python]
description = 'Run the Python test suite or selected tests'
tools = { python = '3.12' }
run = 'python -m pytest'

[tasks.typecheck-python]
description = 'Type check the strict Python migration scope'
tools = { python = '3.12' }
run = 'basedpyright'

[tasks.test-contracts]
description = 'Run architecture and compatibility contract tests'
tools = { python = '3.12' }
run = 'python -m pytest tests/contracts tests/architecture -q'

[tasks.generate-schemas]
description = 'Generate deterministic bridge JSON Schema and TypeScript DTOs'
tools = { python = '3.12', node = '22', npm = '10.9.8' }
run = 'python scripts/generate_bridge_schemas.py'

[tasks.lan-v1-oracle]
description = 'Validate the LAN v1 wire oracle'
tools = { python = '3.12' }
run = 'python -m pytest tests/protocol/test_lan_v1_protocol.py -q'

[tasks.lint]
description = 'Check Python lint and formatting'
tools = { python = '3.12' }
run = [
  'ruff check src/',
  'black --check src/',
]

[tasks.format]
description = 'Format Python sources'
tools = { python = '3.12' }
run = 'black src/'

[tasks.frontend]
description = 'Build the Vue frontend'
tools = { node = '22', npm = '10.9.8' }
run = 'npm run build'

[tasks.typecheck-frontend]
description = 'Type check the strict frontend migration scope'
tools = { node = '22', npm = '10.9.8' }
run = 'npm run typecheck'

[tasks.test-frontend]
description = 'Run frontend unit tests'
tools = { node = '22', npm = '10.9.8' }
run = 'npm run test'

[tasks.build-frontend]
description = 'Build the Vue frontend'
tools = { node = '22', npm = '10.9.8' }
run = 'npm run build'

[tasks.e2e]
description = 'Run Playwright browser tests'
tools = { node = '22', npm = '10.9.8' }
depends = ['build-frontend']
run = [
  'npm exec playwright install chromium',
  'npm run test:e2e',
]

[tasks.check]
description = 'Run all quality gates'
run = [
  'mise run lint',
  'mise run typecheck-python',
  'mise run test-python',
  'mise run typecheck-frontend',
  'mise run test-frontend',
  'mise run test-contracts',
  'mise run build-frontend',
  'mise run e2e',
  'mise run package-smoke',
]

[tasks.build]
description = 'Build the application package'
tools = { python = '3.12' }
run = 'python scripts/build.py'

[tasks.package-smoke]
description = 'Validate package contracts without building artifacts'
tools = { python = '3.12' }
run = 'python -m scripts.package_smoke'

[tasks.plugins-pack]
description = 'Pack the nine official plugin ZIP attachments into dist/plugins'
tools = { python = '3.12' }
run = 'python scripts/plugin_packaging.py --pack-zips --out dist/plugins'

[tasks.plugins-install-dev]
description = 'Install the nine official plugins through the real transaction (usage: mise run plugins-install-dev -- --data-dir <DIR> [--version X])'
tools = { python = '3.12' }
run = 'python scripts/plugin_packaging.py --install-dev'

