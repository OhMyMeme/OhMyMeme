<!DOCTYPE html>
<html lang="zh-CN" style="background:#0d0d0f">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OhMyMeme</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0d0d0f;
  --surface: #151517;
  --surface-2: #1a1a1d;
  --card: #1e1e22;
  --card-hover: #25252a;
  --border: #2a2a2f;
  --border-light: #333338;
  --fg: #e4e4e7;
  --fg-secondary: #a1a1aa;
  --muted: #71717a;
  --accent: #3b82f6;
  --accent-hover: #60a5fa;
  --accent-muted: rgba(59, 130, 246, 0.1);
  --radius-sm: 6px;
  --radius: 8px;
  --radius-lg: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.2);
  --shadow-lg: 0 4px 24px rgba(0,0,0,.5);
  --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
}
html { font-size: 14px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
  height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
#app { display: flex; flex-direction: column; height: 100vh; max-width: 920px; margin: 0 auto; padding: 0 16px; }

/* Title */
#titlebar {
  display: flex; align-items: center; gap: 4px;
  padding: 10px 4px 8px; flex-shrink: 0; cursor: move;
  -webkit-user-select: none; user-select: none;
}
#titlebar .logo {
  font-size: 15px; font-weight: 600; letter-spacing: -0.02em;
  color: var(--fg); padding: 0 8px; cursor: move;
}
#titlebar .logo span { color: var(--accent); }
#titlebar .spacer { flex: 1; cursor: move; }
.title-btn {
  background: transparent; border: none; color: var(--muted);
  font-size: 12.5px; cursor: pointer; padding: 5px 12px;
  border-radius: var(--radius-sm); transition: all var(--transition);
  font-family: inherit; letter-spacing: 0.01em;
}
.title-btn:hover { background: var(--surface-2); color: var(--fg); }
.title-btn:active { background: var(--card); transform: scale(0.97); }

/* Search */
#search-wrap { position: relative; margin-bottom: 10px; flex-shrink: 0; }
#search {
  width: 100%; padding: 9px 14px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--fg);
  font-size: 13.5px; outline: none; transition: all var(--transition);
  font-family: inherit;
}
#search:focus { border-color: var(--accent); background: var(--surface-2); }
#search::placeholder { color: var(--muted); }

/* Tags */
#tagbar {
  display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto;
  padding: 2px 0 10px; flex-shrink: 0;
  scrollbar-width: none; -ms-overflow-style: none;
}
#tagbar::-webkit-scrollbar { display: none; }
.tag {
  padding: 3px 11px; border-radius: 100px; font-size: 11.5px;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  background: var(--surface-2); color: var(--muted);
  border: 1px solid transparent; transition: all var(--transition);
  user-select: none;
}
.tag:hover { color: var(--fg-secondary); border-color: var(--border-light); }
.tag.active { background: var(--accent-muted); color: var(--accent); border-color: var(--accent); }

/* Collection bar */
#colbar {
  display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto;
  padding: 2px 0 10px; flex-shrink: 0;
  scrollbar-width: none; -ms-overflow-style: none;
}
#colbar::-webkit-scrollbar { display: none; }
.col-tag {
  padding: 3px 11px; border-radius: 100px; font-size: 11.5px;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  background: var(--card); color: var(--muted);
  border: 1px solid var(--border); transition: all var(--transition);
  user-select: none;
}
.col-tag:hover { color: var(--fg-secondary); border-color: var(--border-light); }
.col-tag.active { background: var(--accent-muted); color: var(--accent); border-color: var(--accent); }

/* Grid */
#grid-wrap { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 2px 0 8px; }
#grid-wrap::-webkit-scrollbar { width: 5px; }
#grid-wrap::-webkit-scrollbar-track { background: transparent; }
#grid-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 100px; }
#grid-wrap::-webkit-scrollbar-thumb:hover { background: var(--border-light); }
#meme-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
  gap: 10px; padding-bottom: 4px;
}
.meme-card {
  background: var(--card); border-radius: var(--radius);
  overflow: hidden; cursor: pointer; position: relative;
  aspect-ratio: 1; border: 1px solid var(--border);
  transition: all var(--transition);
}
.meme-card:hover {
  border-color: var(--accent); transform: translateY(-1px);
  box-shadow: 0 0 0 1px var(--accent);
}
.meme-card:active { transform: scale(0.97); }
.meme-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.meme-card .name {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 20px 7px 5px 7px;
  background: linear-gradient(transparent, rgba(0,0,0,.75));
  font-size: 10.5px; color: rgba(255,255,255,.8);
  text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
  line-height: 1.4;
}
.meme-card .gif-badge {
  position: absolute; top: 5px; left: 5px;
  background: rgba(0,0,0,.6); color: #fff;
  font-size: 9px; font-weight: 600; padding: 1px 6px;
  border-radius: 4px; letter-spacing: 0.04em;
  backdrop-filter: blur(4px);
}

/* Empty */
#empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--muted); gap: 10px;
}
#empty .icon { font-size: 38px; line-height: 1; }
#empty .text { font-size: 13.5px; }

/* Toast */
#toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--surface); color: var(--fg); padding: 9px 22px;
  border-radius: var(--radius); font-size: 13px;
  border: 1px solid var(--border-light);
  box-shadow: var(--shadow-lg); pointer-events: none; z-index: 999;
  opacity: 0; transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Loading */
#loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--bg); z-index: 10; transition: opacity 300ms;
}
#loading.hidden { opacity: 0; pointer-events: none; }
.spinner { width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Context Menu */
#ctx-menu {
  position: fixed; z-index: 200;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  min-width: 150px;
  padding: 4px;
  display: none;
  animation: fadeIn .1s ease;
}
#ctx-menu.show { display: block; }
.ctx-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; font-size: 12.5px; color: var(--fg);
  border-radius: var(--radius-sm);
  cursor: pointer; white-space: nowrap;
  transition: background var(--transition);
  user-select: none;
  border: none; background: none; width: 100%; font-family: inherit; text-align: left;
}
.ctx-item:hover { background: var(--card); color: var(--fg); }
.ctx-item.danger { color: #ef4444; }
.ctx-item.danger:hover { background: rgba(239,68,68,.1); }
.ctx-item.disabled { color: var(--muted); cursor: not-allowed; }
.ctx-item.disabled:hover { background: transparent; }
.ctx-divider { height: 1px; background: var(--border); margin: 4px 8px; }
.ctx-submenu {
  position: fixed; z-index: 210;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  min-width: 180px; max-height: 300px; overflow-y: auto;
  padding: 4px;
  display: none;
  animation: fadeIn .1s ease;
}
.ctx-submenu.show { display: block; }

/* Folder cards */
.meme-card.folder-card { cursor: pointer; border: 1px dashed var(--border-light); }
.meme-card.folder-card:hover { border-color: var(--accent); background: var(--accent-muted) !important; }
.meme-card.folder-card img { display: none; }
.meme-card.folder-card .name { display: none; }

/* Drag and drop */
.meme-card.dragging { opacity: .5; transform: scale(.95); }
.meme-card.drag-over { border-color: var(--accent); }
#meme-grid.drag-active .meme-card:not(.folder-card) { transition: transform 200ms ease; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 18px; font-size: 12.5px; font-family: inherit;
  border-radius: var(--radius-sm); cursor: pointer; line-height: 1.4;
  transition: all var(--transition); user-select: none;
  border: 1px solid transparent; background: transparent; color: var(--fg);
  white-space: nowrap; text-decoration: none; outline: none;
}
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-primary:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.btn-secondary { background: transparent; color: var(--fg); border-color: var(--border); }
.btn-secondary:hover { background: var(--card); border-color: var(--border-light); }
.btn-secondary:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--border-light); }
.btn-ghost { background: transparent; color: var(--muted); border-color: transparent; }
.btn-ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn-ghost:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--border-light); }
.btn-danger { background: #ef4444; color: #fff; border-color: #ef4444; }
.btn-danger:hover { background: #f87171; border-color: #f87171; }
.btn-danger:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #ef4444; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-xs { padding: 4px 8px; font-size: 11px; }
.btn-flex { flex: 1; }
.icon-btn {
  background: transparent; border: none; cursor: pointer;
  padding: 5px; border-radius: var(--radius-sm);
  transition: all var(--transition); line-height: 0;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { transform: scale(0.93); }
.icon-btn svg { width: 16px; height: 16px; display: block; }
.icon-btn svg path { fill: var(--muted); transition: fill var(--transition); }
.icon-btn:hover svg path { fill: var(--fg); }

/* Drop overlay */
#drop-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(13,13,15,.75);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 150ms ease;
  border: 3px dashed var(--accent);
}
#drop-overlay.drag-over { opacity: 1; }
#drop-overlay .drop-content {
  font-size: 18px; font-weight: 500; color: var(--accent);
  padding: 40px 60px; border-radius: var(--radius-lg);
  background: var(--surface); border: 1px solid var(--accent);
}
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="logo">OhMy<span>Meme</span></div>
    <span class="spacer"></span>
    <button class="icon-btn" onclick="syncUpload()" title="上传到远端">
      <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M481.749333 353.792c16.682667-16.64 43.690667-16.64 60.373334 0l120.917333 120.832 3.541333 4.010667a42.666667 42.666667 0 0 1-63.872 56.32L554.666667 486.954667V896a42.666667 42.666667 0 0 1-85.333334 0v-409.173333l-48.170666 48.128a42.666667 42.666667 0 0 1-60.330667 0l-3.541333-4.010667a42.666667 42.666667 0 0 1 3.541333-56.32zM512 85.333333c122.538667 0 227.84 73.813333 273.92 179.370667A213.333333 213.333333 0 0 1 725.333333 682.666667a42.666667 42.666667 0 0 1-4.992-85.034667L725.333333 597.333333a128 128 0 0 0 36.394667-250.794666l-38.144-11.264-15.914667-36.437334a213.376 213.376 0 0 0-407.296 58.026667l-7.381333 58.368-57.173333 13.824A85.418667 85.418667 0 0 0 256 597.333333h42.666667a42.666667 42.666667 0 0 1 0 85.333334H256a170.666667 170.666667 0 0 1-40.277333-336.554667A298.709333 298.709333 0 0 1 512 85.333333z"/></svg>
    </button>
    <button class="icon-btn" onclick="syncDownload()" title="从远端下载">
      <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
        <path d="M512 85.333333c122.538667 0 227.84 73.813333 273.92 179.370667A213.333333 213.333333 0 0 1 725.333333 682.666667a42.666667 42.666667 0 0 1-4.992-85.034667L725.333333 597.333333a128 128 0 0 0 36.394667-250.794666l-38.144-11.264-15.914667-36.437334a213.376 213.376 0 0 0-407.296 58.026667l-7.381333 58.368-57.173333 13.824A85.418667 85.418667 0 0 0 256 597.333333h42.666667a42.666667 42.666667 0 0 1 0 85.333334H256a170.666667 170.666667 0 0 1-40.277333-336.554667A298.709333 298.709333 0 0 1 512 85.333333z"/>
        <path transform="translate(0 1280) scale(1 -1)" d="M481.749333 353.792c16.682667-16.64 43.690667-16.64 60.373334 0l120.917333 120.832 3.541333 4.010667a42.666667 42.666667 0 0 1-63.872 56.32L554.666667 486.954667V896a42.666667 42.666667 0 0 1-85.333334 0v-409.173333l-48.170666 48.128a42.666667 42.666667 0 0 1-60.330667 0l-3.541333-4.010667a42.666667 42.666667 0 0 1 3.541333-56.32z"/>
      </svg>
    </button>
    <button class="title-btn" onclick="showImportMenu()">导入</button>
    <button class="title-btn" onclick="rescanCache()">刷新</button>
    <button class="title-btn" onclick="openSettings()">设置</button>
    <button class="title-btn" onclick="hide()" style="font-size: 15px; padding: 5px 10px; color: var(--muted);">x</button>
  </div>
  <div id="search-wrap">
    <input id="search" type="text" placeholder="搜索表情包..." oninput="onSearch()" autofocus spellcheck="false">
  </div>
  <div id="tagbar"></div>
  <div id="colbar"></div>
  <div id="grid-wrap">
    <div id="meme-grid"></div>
    <div id="empty" style="display:none">
      <div class="icon">_(:3 」∠)_</div>
      <div class="text">还没有表情包，点击「导入」添加</div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="loading"><div class="spinner"></div></div>
<div id="drop-overlay">
  <div class="drop-content">拖放图片到此处导入</div>
</div>
<div id="ctx-menu">
  <button class="ctx-item" data-action="rename">重命名</button>
  <button class="ctx-item" data-action="favorite">收藏</button>
  <button class="ctx-item" data-action="collection">添加分组</button>
  <button class="ctx-item" data-action="add-to-subgroup" style="display:none">加入小分组</button>
  <button class="ctx-item" data-action="remove-collection" style="display:none">移至上级分组</button>
  <button class="ctx-item danger" data-action="delete-folder" style="display:none">删除小分组</button>
  <div class="ctx-divider"></div>
  <button class="ctx-item danger" data-action="delete">删除</button>
</div>
<div id="ctx-subgroup-menu" class="ctx-submenu"></div>

<script>
let allTags = [], activeTags = new Set(), memes = [], pending = false;
let collections = [], activeCollection = null;
let dragSrcId = null;

async function api(method, ...args) {
  try { return await pywebview.api[method](...args); }
  catch(e) { console.error('API error:', method, e); return null; }
}

let searchTimer;
function onSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => refreshMemes(), 300);
}

async function refreshMemes() {
  const q = document.getElementById('search').value.trim();
  try { memes = await api('search_memes', q, [...activeTags], activeCollection) || []; }
  catch(e) { memes = []; }
  renderGrid();
}

async function refreshTags() {
  try { allTags = await api('get_tags') || []; } catch(e) { allTags = []; }
  renderTags();
}

function renderTags() {
  const bar = document.getElementById('tagbar');
  bar.innerHTML = '';
  if (allTags.length === 0) return;
  allTags.slice(0, 40).forEach(tag => {
    const el = document.createElement('span');
    el.className = 'tag' + (activeTags.has(tag) ? ' active' : '');
    el.textContent = tag;
    el.onclick = () => { toggleTag(tag); };
    bar.appendChild(el);
  });
}

function toggleTag(tag) {
  if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
  renderTags();
  refreshMemes();
}

let activePath = new Set();

function computeActivePath() {
  activePath.clear();
  if (activeCollection == null || activeCollection <= 0) return;
  function search(items, target) {
    for (const c of items) {
      if (c.id === target) {
        activePath.add(c.id);
        return true;
      }
      if (c.children) {
        if (search(c.children, target)) {
          activePath.add(c.id);
          return true;
        }
      }
    }
    return false;
  }
  search(collections, activeCollection);
}

async function refreshCollections() {
  try { collections = await api('get_collections') || []; } catch(e) { collections = []; }
  computeActivePath();
  renderCollections();
}

function renderCollections() {
  const bar = document.getElementById('colbar');
  bar.innerHTML = '';
  if (collections.length === 0) return;
  const flat = [];
  function flatten(items, parentActive) {
    items.forEach(c => {
      if (c.count === 0 && !c.children) return;
      flat.push(c);
      if (parentActive || activeCollection === c.id || activePath.has(c.id)) {
        if (c.children) flatten(c.children, activeCollection === c.id);
      }
    });
  }
  flatten(collections, false);
  flat.forEach(c => {
    const el = document.createElement('span');
    const isActive = activeCollection === c.id || activePath.has(c.id);
    el.className = 'col-tag' + (isActive ? ' active' : '');
    let label = c.name;
    if (c.count > 0) label += ' (' + c.count + ')';
    if (c.children && c.children.length > 0) label += ' \u25BC';
    el.textContent = label;
    el.onclick = () => { toggleCollection(c.id); };
    bar.appendChild(el);
  });
}

function toggleCollection(cid) {
  if (activeCollection === cid) activeCollection = null;
  else activeCollection = cid;
  computeActivePath();
  renderCollections();
  refreshMemes();
}

document.getElementById('colbar').addEventListener('contextmenu', async (e) => {
  const targetCol = activeCollection && activeCollection > 0 ? activeCollection : null;
  if (!targetCol) return;
  e.preventDefault();
  const name = await showPrompt('新建子分组', '');
  if (!name) return;
  const r = await api('create_subcollection', name, targetCol);
  if (r && r.ok) { showToast('已创建子分组'); refreshCollections(); }
  else showToast('创建失败');
});

document.getElementById('grid-wrap').addEventListener('contextmenu', async (e) => {
  if (e.target.closest('.meme-card')) return;
  const targetCol = activeCollection && activeCollection > 0 ? activeCollection : null;
  if (!targetCol) return;
  e.preventDefault();
  const name = await showPrompt('新建子分组', '');
  if (!name) return;
  const r = await api('create_subcollection', name, targetCol);
  if (r && r.ok) { showToast('已创建子分组'); refreshCollections(); refreshMemes(); }
  else showToast('创建失败');
});

/* Context Menu State */
let ctxMeme = null;
let ctxFolder = null;
let lastCtxX = 0, lastCtxY = 0;

function renderGrid() {
  const grid = document.getElementById('meme-grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';
  const curCol = activeCollection && activeCollection > 0 ? activeCollection : null;
  let hasFolderCards = false;
  if (curCol) {
    const parentCol = collections.find(c => c.id === curCol);
    if (parentCol && parentCol.children) {
      hasFolderCards = parentCol.children.length > 0;
      parentCol.children.forEach(child => {
        const card = document.createElement('div');
        card.className = 'meme-card folder-card';
        card.style.background = 'var(--surface)';
        card.dataset.folderId = child.id;
        const preview = document.createElement('div');
        preview.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted);flex-direction:column;gap:4px';
        preview.innerHTML = '<svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="var(--accent)" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span style="font-size:11px;color:var(--fg-secondary)">' + child.name + '</span>';
        card.appendChild(preview);
        card.onclick = () => { activeCollection = child.id; computeActivePath(); refreshMemes(); renderCollections(); };
        card.oncontextmenu = (e) => { e.preventDefault(); showFolderMenu(e, child.id, child.name); };
        grid.appendChild(card);
      });
    }
  }

  if (!memes || memes.length === 0) {
    if (!hasFolderCards) {
      grid.style.display = 'none'; empty.style.display = 'flex'; return;
    }
    grid.style.display = 'grid'; empty.style.display = 'none'; return;
  }
  grid.style.display = 'grid'; empty.style.display = 'none';

  memes.forEach(m => {
    const card = document.createElement('div');
    card.className = 'meme-card';
    card.title = m.name;
    card.style.background = 'var(--surface)';
    card.dataset.memeId = m.id;
    const img = document.createElement('img');
    img.alt = m.name;
    img.loading = 'lazy';
    if (m.is_gif && m.auto_play_gif) {
      img.src = '/api/original/' + m.id + '/' + encodeURIComponent(m.filename);
    } else {
      img.src = '/api/thumb/' + m.id + '/' + encodeURIComponent(m.filename);
    }
    card.appendChild(img);

    const dn = m.name.length > 16 ? m.name.slice(0, 13) + '..' : m.name;
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = dn;
    card.appendChild(name);

    if (m.is_gif) {
      const badge = document.createElement('span');
      badge.className = 'gif-badge';
      badge.textContent = 'GIF';
      card.appendChild(badge);
    }

    card.onclick = () => copyMeme(m.id, m.name);
    card.oncontextmenu = (e) => { e.preventDefault(); showCtxMenu(e, m); };
    grid.appendChild(card);
  });

  // Custom drag-to-reorder
  let dragActive = false, dragStartY = 0, dragCard = null, dragIdx = -1;
  grid.addEventListener('mousedown', (e) => {
    dragCard = e.target.closest('.meme-card:not(.folder-card)');
    if (!dragCard) return;
    dragActive = false;
    dragStartY = e.clientY;
    dragIdx = Array.from(grid.children).indexOf(dragCard);
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragCard) return;
    if (!dragActive && Math.abs(e.clientY - dragStartY) > 8) {
      dragActive = true;
      dragCard.classList.add('dragging');
      grid.classList.add('drag-active');
    }
    if (!dragActive) return;
    const rects = grid.querySelectorAll('.meme-card:not(.folder-card)');
    for (const rc of rects) {
      if (rc === dragCard) continue;
      const r = rc.getBoundingClientRect();
      if (e.clientY > r.top && e.clientY < r.bottom) {
        const after = e.clientY > r.top + r.height / 2;
        rc.style.borderBottom = after ? '2px solid var(--accent)' : '';
        rc.style.borderTop = after ? '' : '2px solid var(--accent)';
      } else {
        rc.style.borderBottom = '';
        rc.style.borderTop = '';
      }
    }
  });
  document.addEventListener('mouseup', async () => {
    if (!dragCard) { dragActive = false; return; }
    grid.classList.remove('drag-active');
    dragCard.classList.remove('dragging');
    grid.querySelectorAll('.meme-card').forEach(c => { c.style.borderBottom = ''; c.style.borderTop = ''; });
    if (dragActive) {
      const allCards = grid.querySelectorAll('.meme-card:not(.folder-card)');
      let newIdx = memes.length - 1;
      for (let i = 0; i < allCards.length; i++) {
        const rc = allCards[i];
        if (rc === dragCard) continue;
        // Find where dragCard is inserted
      }
      // simpler: just rebuild memes from grid order
      const ordered = [];
      grid.querySelectorAll('.meme-card:not(.folder-card)').forEach(c => {
        const id = parseInt(c.dataset.memeId);
        const found = memes.find(x => x.id === id);
        if (found) ordered.push(found);
      });
      if (ordered.length === memes.length) {
        memes = ordered;
        await api('reorder_memes', memes.map(x => x.id));
      }
    }
    dragCard = null;
    dragActive = false;
  });
}

/* Context Menu */
function showCtxMenu(e, meme) {
  hideSubgroupMenu();
  ctxMeme = meme;
  lastCtxX = e.clientX; lastCtxY = e.clientY;
  const menu = document.getElementById('ctx-menu');
  // 恢复所有项目可见
  menu.querySelectorAll('.ctx-item, .ctx-divider').forEach(el => {
    el.style.display = '';
  });
  const dfBtn = menu.querySelector('[data-action="delete-folder"]');
  if (dfBtn) dfBtn.style.display = 'none';
  const favBtn = menu.querySelector('[data-action="favorite"]');
  if (meme.favorited) {
    favBtn.textContent = '取消收藏';
  } else {
    favBtn.textContent = '收藏';
  }
  const rmBtn = menu.querySelector('[data-action="remove-collection"]');
  if (activeCollection && activeCollection !== -1) {
    rmBtn.style.display = 'flex';
  } else {
    rmBtn.style.display = 'none';
  }
  const sgBtn = menu.querySelector('[data-action="add-to-subgroup"]');
  if (sgBtn) {
    sgBtn.style.display = (activeCollection && activeCollection > 0) ? 'flex' : 'none';
  }
  menu.classList.add('show');
  const rect = menu.getBoundingClientRect();
  const overflowRight = rect.right - window.innerWidth;
  if (overflowRight > 0) {
    menu.style.left = (e.clientX - rect.width) + 'px';
  } else {
    menu.style.left = e.clientX + 'px';
  }
  menu.style.top = e.clientY + 'px';
}

function showFolderMenu(e, folderId, folderName) {
  hideCtxMenu();
  ctxFolder = { id: folderId, name: folderName };
  lastCtxX = e.clientX; lastCtxY = e.clientY;
  const menu = document.getElementById('ctx-menu');
  menu.querySelectorAll('.ctx-item, .ctx-divider').forEach(el => {
    el.style.display = 'none';
  });
  const df = menu.querySelector('[data-action="delete-folder"]');
  if (df) df.style.display = 'flex';
  menu.classList.add('show');
  const rect = menu.getBoundingClientRect();
  let left = e.clientX, top = e.clientY;
  if (left + rect.width > window.innerWidth) left = e.clientX - rect.width;
  if (top + rect.height > window.innerHeight) top = window.innerHeight - rect.height - 4;
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
}

function hideCtxMenu() {
  document.getElementById('ctx-menu').classList.remove('show');
  document.getElementById('ctx-subgroup-menu').classList.remove('show');
  ctxMeme = null;
  ctxFolder = null;
}

async function showSubgroupPicker(items) {
  return new Promise(resolve => {
    const menu = document.getElementById('ctx-subgroup-menu');
    menu.innerHTML = '';
    items.forEach(([label, val]) => {
      const btn = document.createElement('button');
      btn.className = 'ctx-item';
      btn.textContent = label;
      btn.onclick = () => { menu.classList.remove('show'); resolve(val); };
      menu.appendChild(btn);
    });
    menu.style.left = '';
    menu.style.top = '';
    menu.classList.add('show');
    const mr = menu.getBoundingClientRect();
    let left = lastCtxX;
    let top = lastCtxY;
    if (left + mr.width > window.innerWidth) left = window.innerWidth - mr.width - 4;
    if (top + mr.height > window.innerHeight) top = window.innerHeight - mr.height - 4;
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
  });
}

function hideSubgroupMenu() {

}

document.addEventListener('click', (e) => {

document.getElementById('ctx-menu').addEventListener('click', async (e) => {
  const item = e.target.closest('.ctx-item');
  if (!item || item.classList.contains('disabled')) return;
  const action = item.dataset.action;
  const f = ctxFolder;
  const m = ctxMeme;
  if (!m && action !== 'delete-folder') return;
  hideCtxMenu();

  if (action === 'delete-folder') {
    if (!f) return;
    const confirmed = await showConfirm('删除小分组', '确定删除小分组「' + f.name + '」？分组内表情包将移回上层分组。');
    if (!confirmed) return;
    // 将所有表情包移回上层
    const parentCol = collections.find(c => c.children && c.children.some(ch => ch.id === f.id));
    const parentId = parentCol ? parentCol.id : null;
    const memesInFolder = await api('search_memes', '', [], f.id) || [];
    for (const mm of memesInFolder) {
      if (parentId) await api('add_to_existing_collection', mm.id, parentId);
    }
    await api('delete_collection', f.id);
    showToast('小分组已删除');
    if (activeCollection === f.id) activeCollection = parentId;
    refreshCollections(); refreshMemes(); return;
  }

  switch (action) {
    case 'rename': {
      const newName = await showPrompt('重命名', m.name);
      if (!newName || newName === m.name) return;
      const ok = await api('rename_meme', m.id, newName);
      if (ok) { showToast('重命名成功'); refreshMemes(); }
      else { showToast('重命名失败'); }
      break;
    }
    case 'favorite': {
      const ok = await api('toggle_favorite', m.id);
      if (ok !== null) {
        await refreshCollections();
        if (!ok && activeCollection === -1) {
          const fav = collections.find(x => x.id === -1);
          if (!fav || fav.count === 0) {
            activeCollection = null;
          }
        }
        refreshMemes(); showToast(ok ? '已收藏' : '已取消收藏');
      }
      break;
    }
    case 'collection': {
      const name = await showPrompt('添加分组', '');
      if (!name) return;
      const ok = await api('add_to_collection', m.id, name);
      if (ok) { showToast('已添加到分组：' + name); refreshCollections(); }
      else showToast('添加分组失败');
      break;
    }
    case 'add-to-subgroup': {
      const targetCol = activeCollection && activeCollection > 0 ? activeCollection : null;
      const children = targetCol ? (await api('get_child_collections', targetCol) || []) : [];
      const els = [['新建小分组', '__new__']];
      children.forEach(ch => els.push([ch.name, ch.id]));
      if (els.length === 0) {
        const name = await showPrompt('新建小分组', '');
        if (!name) break;
        if (targetCol) {
          const r = await api('create_subcollection', name, targetCol);
          if (r.ok) await api('add_to_existing_collection', m.id, r.id);
        } else {
          await api('add_to_collection', m.id, name);
        }
        showToast('已添加'); refreshCollections(); refreshMemes(); break;
      }
      const picked = await showSubgroupPicker(els);
      if (picked === '__new__') {
        const name = await showPrompt('新建小分组', '');
        if (!name) break;
        if (targetCol) {
          const r = await api('create_subcollection', name, targetCol);
          if (r.ok) await api('add_to_existing_collection', m.id, r.id);
        } else {
          await api('add_to_collection', m.id, name);
        }
        showToast('已添加'); refreshCollections(); refreshMemes();
      } else if (picked && picked > 0) {
        await api('add_to_existing_collection', m.id, picked);
        showToast('已添加'); refreshCollections(); refreshMemes();
      }
      break;
    }
    case 'remove-collection': {
      const removedFrom = activeCollection;
      const ok = await api('remove_from_collection', m.id, removedFrom);
      if (ok) {
        // 如果是从小分组移除，加回上层大分组
        const allCols = collections;
        let parentId = null;
        for (const c of allCols) {
          if (c.children) {
            const found = c.children.find(ch => ch.id === removedFrom);
            if (found) { parentId = c.id; break; }
          }
        }
        if (parentId) await api('add_to_existing_collection', m.id, parentId);
        showToast('已移回上层分组');
        await refreshCollections();
        const c = collections.find(x => x.id === removedFrom);
        if (!c || c.count === 0) {
          if (removedFrom > 0) await api('delete_collection', removedFrom);
          activeCollection = parentId || null;
          renderCollections();
        }
        refreshMemes();
      } else showToast('移除失败');
      break;
    }
    case 'delete': {
      const confirmed = await showConfirm('删除确认', '确定删除「' + m.name + '」？');
      if (!confirmed) return;
      const ok = await api('delete_meme', m.id);
      if (ok) { showToast('已删除'); refreshMemes(); refreshTags(); refreshCollections(); }
      else { showToast('删除失败'); }
      break;
    }
  }
});

/* Custom Modal */
function showPrompt(title, defaultValue) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .15s';
    overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); resolve(null); } };
    const box = document.createElement('div');
    box.style.cssText = 'background:var(--surface);border-radius:var(--radius-lg);padding:24px 28px;width:360px;border:1px solid var(--border);box-shadow:var(--shadow-lg)';
    box.innerHTML = '<div style="margin-bottom:16px"><h2 style="font-size:15px;font-weight:600;color:var(--fg);margin-bottom:4px">' + title + '</h2></div>'
      + '<input id="modal-input" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);color:var(--fg);font-size:13px;outline:none;font-family:inherit;box-sizing:border-box" value="' + defaultValue.replace(/"/g, '&quot;') + '">'
      + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">'
      + '<button id="modal-cancel" class="btn btn-secondary">取消</button>'
      + '<button id="modal-confirm" class="btn btn-primary">确定</button>'
      + '</div>';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    const input = document.getElementById('modal-input');
    input.focus();
    input.select();
    const cleanup = () => { overlay.remove(); };
    document.getElementById('modal-confirm').onclick = () => { const v = input.value; cleanup(); resolve(v); };
    document.getElementById('modal-cancel').onclick = () => { cleanup(); resolve(null); };
    input.onkeydown = (e) => {
      if (e.key === 'Enter') { const v = input.value; cleanup(); resolve(v); }
      if (e.key === 'Escape') { cleanup(); resolve(null); }
    };
  });
}

function showUpdateDialogFromMain(current, latest, url) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:300;animation:fadeIn .15s';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  const box = document.createElement('div');
  box.style.cssText = 'background:var(--surface);border-radius:var(--radius-lg);padding:24px 28px;width:380px;border:1px solid var(--border);box-shadow:var(--shadow-lg)';
  box.innerHTML = '<div style="margin-bottom:16px"><h2 style="font-size:15px;font-weight:600;color:var(--fg);margin-bottom:8px">发现新版本</h2>'
    + '<p style="font-size:13px;color:var(--fg-secondary);line-height:1.6">当前版本: ' + current + '<br>最新版本: ' + latest + '</p></div>'
    + '<div style="display:flex;flex-direction:column;gap:8px">'
    + '<button id="upd-update" class="btn btn-primary" style="width:100%">更新</button>'
    + '<div style="display:flex;gap:8px">'
    + '<button id="upd-later" class="btn btn-secondary btn-flex">稍后提示</button>'
    + '</div></div>';
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  document.getElementById('upd-update').focus();

  document.getElementById('upd-update').onclick = async () => {
    const btn = document.getElementById('upd-update');
    btn.disabled = true;
    btn.textContent = '准备下载...';
    const ok = await api('start_download', url);
    if (!ok) { btn.disabled = false; btn.textContent = '更新'; return; }

    const container = btn.parentNode;
    container.innerHTML = '<div style="width:100%">'
      + '<div style="font-size:12px;color:var(--fg-secondary);margin-bottom:4px;text-align:center" id="upd-progress-text">下载中 0%</div>'
      + '<div style="width:100%;height:8px;background:var(--bg-secondary);border-radius:4px;overflow:hidden">'
      + '<div id="upd-progress-bar" style="width:0%;height:100%;background:var(--accent);border-radius:4px;transition:width .3s"></div></div></div>';

    const poll = setInterval(async () => {
      const s = await api('get_download_progress');
      if (!s) return;
      const pct = s.progress || 0;
      document.getElementById('upd-progress-bar').style.width = pct + '%';
      if (s.status === 'downloading') {
        document.getElementById('upd-progress-text').textContent = '下载中 ' + pct + '%';
      } else if (s.status === 'done') {
        clearInterval(poll);
        document.getElementById('upd-progress-text').textContent = '下载完成，启动安装...';
        const r = await api('run_downloaded_installer');
        overlay.remove();
        if (r) {
          showToast('安装程序已启动，安装完成后将自动更新');
        } else {
          showToast('启动安装程序失败');
        }
      } else if (s.status === 'error') {
        clearInterval(poll);
        document.getElementById('upd-progress-text').textContent = '下载失败: ' + (s.error || '未知错误');
        container.innerHTML += '<button id="upd-retry" class="btn btn-primary" style="width:100%;margin-top:8px">重试</button>';
        document.getElementById('upd-retry').onclick = () => { overlay.remove(); showUpdateDialogFromMain(current, latest, url); };
      }
    }, 500);
  };
  document.getElementById('upd-later').onclick = () => { overlay.remove(); };
  overlay.onkeydown = (e) => { if (e.key === 'Escape') overlay.remove(); };
}

    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .15s';
    overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); resolve(false); } };

    box.style.cssText = 'background:var(--surface);border-radius:var(--radius-lg);padding:24px 28px;width:360px;border:1px solid var(--border);box-shadow:var(--shadow-lg)';
    box.innerHTML = '<div style="margin-bottom:16px"><h2 style="font-size:15px;font-weight:600;color:var(--fg);margin-bottom:4px">' + title + '</h2><p style="font-size:13px;color:var(--fg-secondary)">' + message + '</p></div>'
      + '<div style="display:flex;gap:8px;justify-content:flex-end">'
      + '<button id="modal-cancel" class="btn btn-secondary">取消</button>'
      + '<button id="modal-confirm" class="btn btn-danger">确定</button>'
      + '</div>';
    overlay.appendChild(box);

    document.getElementById('modal-confirm').focus();
    const cleanup = () => { overlay.remove(); };
    document.getElementById('modal-confirm').onclick = () => { cleanup(); resolve(true); };

  });
}

function hideSyncDone() {
  const el = document.getElementById('sync-done-overlay');
  if (el) el.style.display = 'none';
}

function formatSpeed(bytesPerSec) {
  if (bytesPerSec >= 1048576) return (bytesPerSec / 1048576).toFixed(1) + ' MB/s';
  if (bytesPerSec >= 1024) return (bytesPerSec / 1024).toFixed(1) + ' KB/s';
  return bytesPerSec.toFixed(0) + ' B/s';
}

async function doSyncWithProgress(method, title, progressSetting, doneSetting) {
  const s = await api('get_settings');
  const showProgress = s ? s[progressSetting] !== false : true;
  const showDone = s ? s[doneSetting] !== false : true;

  const warnOk = await showUploadWarning();
  if (!warnOk) return;

  syncBg = false;

  if (showProgress) {
    const po = document.getElementById('sync-progress-overlay');
    if (po) {
      document.getElementById('sync-progress-title').textContent = title;
      document.getElementById('sync-progress-file').textContent = '准备中...';
      document.getElementById('sync-progress-bar').style.width = '0%';
      document.getElementById('sync-progress-pct').textContent = '0%';
      document.getElementById('sync-progress-speed').textContent = '';
      po.style.display = 'flex';
      syncPollTimer = setInterval(async () => {
        const p = await api('get_sync_progress');
        if (!p || p.status === 'idle') return;
        document.getElementById('sync-progress-file').textContent = p.current_file || '';
        document.getElementById('sync-progress-bar').style.width = (p.progress || 0) + '%';
        document.getElementById('sync-progress-pct').textContent = (p.progress || 0) + '%';
        if (p.speed) {
          document.getElementById('sync-progress-speed').textContent = formatSpeed(p.speed);
        }
      }, 300);
    }
  }

  const r = await api(method);
  if (syncPollTimer) { clearInterval(syncPollTimer); syncPollTimer = null; }

  if (showProgress && !syncBg) {
    const po = document.getElementById('sync-progress-overlay');
    if (po) po.style.display = 'none';
  }

  if (r && r.ok) {
    const cnt = r.uploaded || r.downloaded || 0;
    showToast('完成: ' + cnt + ' 个');
    if (showDone) {
      document.getElementById('sync-done-title').textContent = title + '完成';
      document.getElementById('sync-done-detail').textContent = '成功 ' + cnt + ' 个';
      const doo = document.getElementById('sync-done-overlay');
      if (doo) doo.style.display = 'flex';
    }
  } else {
    showToast('失败: ' + ((r && r.error) || '未知错误'));
  }
}

async function syncUpload() {
  await doSyncWithProgress('sync_push', '上传中', 'show_upload_progress', 'show_upload_done');
}

async function syncDownload() {
  await doSyncWithProgress('sync_pull', '下载中', 'show_download_progress', 'show_download_done');
  refreshMemes(); refreshTags(); refreshCollections();
}

function hide() { try { pywebview.api.hide_window(); } catch(e) {} }
function openSettings() { try { pywebview.api.open_settings(); } catch(e) {} }

/* Drag-and-drop import */
(function() {
  const overlay = document.getElementById('drop-overlay');
  if (!overlay) return;
  let dragCounter = 0;
  document.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragCounter++;
    overlay.classList.add('drag-over');
  });
  document.addEventListener('dragover', (e) => {
    e.preventDefault();
  });
  document.addEventListener('dragleave', () => {
    dragCounter--;
    if (dragCounter <= 0) { dragCounter = 0; overlay.classList.remove('drag-over'); }
  });
  document.addEventListener('drop', async (e) => {
    e.preventDefault();
    dragCounter = 0;
    overlay.classList.remove('drag-over');
    const files = e.dataTransfer.files;
    if (!files || files.length === 0) return;
    const imgExts = /\.(png|jpg|jpeg|gif|webp|bmp)$/i;
    const items = [];
    for (const file of files) {
      if (!imgExts.test(file.name)) continue;
      try {
        const ab = await file.arrayBuffer();
        const b64 = btoa(new Uint8Array(ab).reduce((s, b) => s + String.fromCharCode(b), ''));
        items.push({ name: file.name, data: b64 });
      } catch(_) {}
    }
    if (items.length === 0) return;
    try {
      const res = await fetch('/api/upload/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ files: items }),
      });
      if (res.ok) { location.reload(); }
    } catch(_) {}
  });
})();

/* Window Drag */
let dragState = null;
const titlebar = document.getElementById('titlebar');
titlebar.addEventListener('mousedown', (e) => {
  if (e.target.closest('.title-btn')) return;
  dragState = { sx: e.screenX, sy: e.screenY };
  e.preventDefault();
});
document.addEventListener('mousemove', (e) => {
  if (!dragState) return;
  const dx = e.screenX - dragState.sx, dy = e.screenY - dragState.sy;
  if (dx !== 0 || dy !== 0) {
    api('move_window', dx, dy);
    dragState.sx = e.screenX; dragState.sy = e.screenY;
  }
});
document.addEventListener('mouseup', () => { dragState = null; });

/* Init */
document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('loading').classList.remove('hidden');
  const data = await api('get_init_data');
  if (data) {
    memes = data.memes || [];
    renderGrid();
    allTags = data.tags || [];
    renderTags();
    collections = data.collections || [];
    renderCollections();
  }
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('search').focus();
  setTimeout(async () => {
    await api('rescan_cache');
    await api('run_auto_sync');
    memes = await api('search_memes', '', [], null) || [];
    renderGrid();
    allTags = await api('get_tags') || [];
    renderTags();
    collections = await api('get_collections') || [];
    renderCollections();
    try {
      const upd = await api('check_update');
      if (upd && upd.has_update) {
        showUpdateDialogFromMain(upd.current, upd.latest, upd.download_url);
      }
    } catch(e) {}
  }, 300);
});
</script>
