<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OhMyMeme</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0d0d0f;
  --surface: #151517;
  --surface-2: #1a1a1d;
  --card: #1e1e22;
  --card-hover: #25252a;
  --border: #2a2a2f;
  --border-light: #333338;
  --fg: #e4e4e7;
  --fg-secondary: #a1a1aa;
  --muted: #71717a;
  --accent: #3b82f6;
  --accent-hover: #60a5fa;
  --accent-muted: rgba(59, 130, 246, 0.1);
  --radius-sm: 6px;
  --radius: 8px;
  --radius-lg: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.2);
  --shadow-lg: 0 4px 24px rgba(0,0,0,.5);
  --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
}
html { font-size: 14px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
  height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
#app { display: flex; flex-direction: column; height: 100vh; max-width: 920px; margin: 0 auto; padding: 0 16px; }

/* Title */
#titlebar {
  display: flex; align-items: center; gap: 4px;
  padding: 10px 4px 8px; flex-shrink: 0; cursor: move;
  -webkit-user-select: none; user-select: none;
}
#titlebar .logo {
  font-size: 15px; font-weight: 600; letter-spacing: -0.02em;
  color: var(--fg); padding: 0 8px; cursor: move;
}
#titlebar .logo span { color: var(--accent); }
#titlebar .spacer { flex: 1; cursor: move; }
.title-btn {
  background: transparent; border: none; color: var(--muted);
  font-size: 12.5px; cursor: pointer; padding: 5px 12px;
  border-radius: var(--radius-sm); transition: all var(--transition);
  font-family: inherit; letter-spacing: 0.01em;
}
.title-btn:hover { background: var(--surface-2); color: var(--fg); }
.title-btn:active { background: var(--card); transform: scale(0.97); }

/* Search */
#search-wrap { position: relative; margin-bottom: 10px; flex-shrink: 0; }
#search {
  width: 100%; padding: 9px 14px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--fg);
  font-size: 13.5px; outline: none; transition: all var(--transition);
  font-family: inherit;
}
#search:focus { border-color: var(--accent); background: var(--surface-2); }
#search::placeholder { color: var(--muted); }

/* Tags */
#tagbar {
  display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto;
  padding: 2px 0 10px; flex-shrink: 0;
  scrollbar-width: none; -ms-overflow-style: none;
}
#tagbar::-webkit-scrollbar { display: none; }
.tag {
  padding: 3px 11px; border-radius: 100px; font-size: 11.5px;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  background: var(--surface-2); color: var(--muted);
  border: 1px solid transparent; transition: all var(--transition);
  user-select: none;
}
.tag:hover { color: var(--fg-secondary); border-color: var(--border-light); }
.tag.active { background: var(--accent-muted); color: var(--accent); border-color: var(--accent); }

/* Collection bar */
#colbar {
  display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto;
  padding: 2px 0 10px; flex-shrink: 0;
  scrollbar-width: none; -ms-overflow-style: none;
}
#colbar::-webkit-scrollbar { display: none; }
.col-tag {
  padding: 3px 11px; border-radius: 100px; font-size: 11.5px;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  background: var(--card); color: var(--muted);
  border: 1px solid var(--border); transition: all var(--transition);
  user-select: none;
}
.col-tag:hover { color: var(--fg-secondary); border-color: var(--border-light); }
.col-tag.active { background: var(--accent-muted); color: var(--accent); border-color: var(--accent); }

/* Grid */
#grid-wrap { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 2px 0 8px; }
#grid-wrap::-webkit-scrollbar { width: 5px; }
#grid-wrap::-webkit-scrollbar-track { background: transparent; }
#grid-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 100px; }
#grid-wrap::-webkit-scrollbar-thumb:hover { background: var(--border-light); }
#meme-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
  gap: 10px; padding-bottom: 4px;
}
.meme-card {
  background: var(--card); border-radius: var(--radius);
  overflow: hidden; cursor: pointer; position: relative;
  aspect-ratio: 1; border: 1px solid var(--border);
  transition: all var(--transition);
}
.meme-card:hover {
  border-color: var(--accent); transform: translateY(-1px);
  box-shadow: 0 0 0 1px var(--accent);
}
.meme-card:active { transform: scale(0.97); }
.meme-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.meme-card .name {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 20px 7px 5px 7px;
  background: linear-gradient(transparent, rgba(0,0,0,.75));
  font-size: 10.5px; color: rgba(255,255,255,.8);
  text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
  line-height: 1.4;
}
.meme-card .gif-badge {
  position: absolute; top: 5px; left: 5px;
  background: rgba(0,0,0,.6); color: #fff;
  font-size: 9px; font-weight: 600; padding: 1px 6px;
  border-radius: 4px; letter-spacing: 0.04em;
  backdrop-filter: blur(4px);
}

/* Empty */
#empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--muted); gap: 10px;
}
#empty .icon { font-size: 38px; line-height: 1; }
#empty .text { font-size: 13.5px; }

/* Toast */
#toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--surface); color: var(--fg); padding: 9px 22px;
  border-radius: var(--radius); font-size: 13px;
  border: 1px solid var(--border-light);
  box-shadow: var(--shadow-lg); pointer-events: none; z-index: 999;
  opacity: 0; transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Loading */
#loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--bg); z-index: 10; transition: opacity 300ms;
}
#loading.hidden { opacity: 0; pointer-events: none; }
.spinner { width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Context Menu */
#ctx-menu {
  position: fixed; z-index: 200;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  min-width: 150px;
  padding: 4px;
  display: none;
  animation: fadeIn .1s ease;
}
#ctx-menu.show { display: block; }
.ctx-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; font-size: 12.5px; color: var(--fg);
  border-radius: var(--radius-sm);
  cursor: pointer; white-space: nowrap;
  transition: background var(--transition);
  user-select: none;
  border: none; background: none; width: 100%; font-family: inherit; text-align: left;
}
.ctx-item:hover { background: var(--card); color: var(--fg); }
.ctx-item.danger { color: #ef4444; }
.ctx-item.danger:hover { background: rgba(239,68,68,.1); }
.ctx-item.disabled { color: var(--muted); cursor: not-allowed; }
.ctx-item.disabled:hover { background: transparent; }
.ctx-divider { height: 1px; background: var(--border); margin: 4px 8px; }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="logo">OhMy<span>Meme</span></div>
    <span class="spacer"></span>
    <button class="title-btn" onclick="importMemes()">导入</button>
    <button class="title-btn" onclick="rescanCache()">刷新</button>
    <button class="title-btn" onclick="toggleSettings()">设置</button>
    <button class="title-btn" onclick="hide()" style="font-size: 15px; padding: 5px 10px; color: var(--muted);">x</button>
  </div>
  <div id="search-wrap">
    <input id="search" type="text" placeholder="搜索表情包..." oninput="onSearch()" autofocus spellcheck="false">
  </div>
  <div id="tagbar"></div>
  <div id="colbar"></div>
  <div id="grid-wrap">
    <div id="meme-grid"></div>
    <div id="empty" style="display:none">
      <div class="icon">_(:3 」∠)_</div>
      <div class="text">还没有表情包，点击「导入」添加</div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="loading"><div class="spinner"></div></div>
<div id="ctx-menu">
  <button class="ctx-item" data-action="rename">重命名</button>
  <button class="ctx-item" data-action="favorite">收藏</button>
  <button class="ctx-item" data-action="collection">添加分组</button>
  <button class="ctx-item" data-action="remove-collection" style="display:none">从分组移除</button>
  <div class="ctx-divider"></div>
  <button class="ctx-item disabled" data-action="sync">云端同步</button>
  <div class="ctx-divider"></div>
  <button class="ctx-item danger" data-action="delete">删除</button>
</div>

<script>
let allTags = [], activeTags = new Set(), memes = [], pending = false;
let collections = [], activeCollection = null;

async function api(method, ...args) {
  try { return await pywebview.api[method](...args); }
  catch(e) { console.error('API error:', method, e); return null; }
}

let searchTimer;
function onSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => refreshMemes(), 200);
}

async function refreshMemes() {
  const q = document.getElementById('search').value.trim();
  try { memes = await api('search_memes', q, [...activeTags], activeCollection) || []; }
  catch(e) { memes = []; }
  renderGrid();
}

async function refreshTags() {
  try { allTags = await api('get_tags') || []; } catch(e) { allTags = []; }
  renderTags();
}

function renderTags() {
  const bar = document.getElementById('tagbar');
  bar.innerHTML = '';
  if (allTags.length === 0) return;
  allTags.slice(0, 40).forEach(tag => {
    const el = document.createElement('span');
    el.className = 'tag' + (activeTags.has(tag) ? ' active' : '');
    el.textContent = tag;
    el.onclick = () => { toggleTag(tag); };
    bar.appendChild(el);
  });
}

function toggleTag(tag) {
  if (activeTags.has(tag)) activeTags.delete(tag); else activeTags.add(tag);
  renderTags();
  refreshMemes();
}

async function refreshCollections() {
  try { collections = await api('get_collections') || []; } catch(e) { collections = []; }
  renderCollections();
}

function renderCollections() {
  const bar = document.getElementById('colbar');
  bar.innerHTML = '';
  if (collections.length === 0) return;
  collections.forEach(c => {
    if (c.count === 0) return;
    const el = document.createElement('span');
    el.className = 'col-tag' + (activeCollection === c.id ? ' active' : '');
    el.textContent = c.name + ' (' + c.count + ')';
    el.onclick = () => { toggleCollection(c.id); };
    bar.appendChild(el);
  });
}

function toggleCollection(cid) {
  if (activeCollection === cid) activeCollection = null;
  else activeCollection = cid;
  renderCollections();
  refreshMemes();
}

/* Context Menu State */
let ctxMeme = null;

function renderGrid() {
  const grid = document.getElementById('meme-grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';
  if (!memes || memes.length === 0) {
    grid.style.display = 'none'; empty.style.display = 'flex'; return;
  }
  grid.style.display = 'grid'; empty.style.display = 'none';

  memes.forEach(m => {
    const card = document.createElement('div');
    card.className = 'meme-card';
    card.title = m.filename;

    const img = document.createElement('img');
    img.alt = m.filename;
    img.loading = 'lazy';
    if (m.is_gif && m.auto_play_gif) {
      img.src = '/api/original/' + m.id + '/' + encodeURIComponent(m.filename);
    } else {
      img.src = '/api/thumb/' + m.id + '/' + encodeURIComponent(m.filename);
    }
    card.appendChild(img);

    const dn = m.filename.length > 16 ? m.filename.slice(0, 13) + '..' : m.filename;
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = dn;
    card.appendChild(name);

    if (m.is_gif) {
      const badge = document.createElement('span');
      badge.className = 'gif-badge';
      badge.textContent = 'GIF';
      card.appendChild(badge);
    }

    card.onclick = () => copyMeme(m.id, m.filename);
    card.oncontextmenu = (e) => { e.preventDefault(); showCtxMenu(e, m); };
    grid.appendChild(card);
  });
}

async function copyMeme(id, filename) {
  const ok = await api('copy_meme', id);
  if (ok) { showToast(filename + ' 已复制'); setTimeout(hide, 300); }
  else { showToast('复制失败'); }
}

async function importMemes() {
  if (pending) return;
  pending = true;
  const result = await api('import_memes');
  pending = false;
  if (result) { showToast('导入完成'); refreshMemes(); refreshTags(); refreshCollections(); }
}

async function rescanCache() {
  await api('rescan_cache');
  showToast('缓存扫描完成');
  refreshMemes();
  refreshTags();
  refreshCollections();
}

/* Context Menu */
function showCtxMenu(e, meme) {
  ctxMeme = meme;
  const menu = document.getElementById('ctx-menu');
  const favBtn = menu.querySelector('[data-action="favorite"]');
  if (meme.favorited) {
    favBtn.textContent = '取消收藏';
  } else {
    favBtn.textContent = '收藏';
  }
  const rmBtn = menu.querySelector('[data-action="remove-collection"]');
  if (activeCollection && activeCollection !== -1) {
    rmBtn.style.display = 'flex';
  } else {
    rmBtn.style.display = 'none';
  }
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.classList.add('show');
}

function hideCtxMenu() {
  document.getElementById('ctx-menu').classList.remove('show');
  ctxMeme = null;
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('#ctx-menu')) hideCtxMenu();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') hideCtxMenu();
});

document.getElementById('ctx-menu').addEventListener('click', async (e) => {
  const item = e.target.closest('.ctx-item');
  if (!item || item.classList.contains('disabled')) return;
  const action = item.dataset.action;
  const m = ctxMeme;
  if (!m) return;
  hideCtxMenu();

  switch (action) {
    case 'rename': {
      const base = m.filename.replace(/\.[^.]+$/, '');
      const newName = await showPrompt('重命名', base);
      if (!newName || newName === base) return;
      const ok = await api('rename_meme', m.id, newName);
      if (ok) { showToast('重命名成功'); refreshMemes(); }
      else { showToast('重命名失败'); }
      break;
    }
    case 'favorite': {
      const ok = await api('toggle_favorite', m.id);
      if (ok !== null) { refreshMemes(); refreshCollections(); showToast(ok ? '已收藏' : '已取消收藏'); }
      break;
    }
    case 'collection': {
      const name = await showPrompt('添加分组', '');
      if (!name) return;
      const ok = await api('add_to_collection', m.id, name);
      if (ok) { showToast('已添加到分组：' + name); refreshCollections(); }
      else showToast('添加分组失败');
      break;
    }
    case 'remove-collection': {
      const ok = await api('remove_from_collection', m.id, activeCollection);
      if (ok) {
        showToast('已从分组移除');
        await refreshCollections();
        const c = collections.find(x => x.id === activeCollection);
        if (!c || c.count === 0) {
          activeCollection = null;
          renderCollections();
        }
        refreshMemes();
      } else showToast('移除失败');
      break;
    }
    case 'sync': {
      showToast('同步功能尚未实现');
      break;
    }
    case 'delete': {
      const confirmed = await showConfirm('删除确认', '确定删除「' + m.filename + '」？');
      if (!confirmed) return;
      const ok = await api('delete_meme', m.id);
      if (ok) { showToast('已删除'); refreshMemes(); refreshTags(); refreshCollections(); }
      else { showToast('删除失败'); }
      break;
    }
  }
});

/* Custom Modal */
function showPrompt(title, defaultValue) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .15s';
    overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); resolve(null); } };
    const box = document.createElement('div');
    box.style.cssText = 'background:var(--surface);border-radius:var(--radius-lg);padding:24px 28px;width:360px;border:1px solid var(--border);box-shadow:var(--shadow-lg)';
    box.innerHTML = '<div style="margin-bottom:16px"><h2 style="font-size:15px;font-weight:600;color:var(--fg);margin-bottom:4px">' + title + '</h2></div>'
      + '<input id="modal-input" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);color:var(--fg);font-size:13px;outline:none;font-family:inherit;box-sizing:border-box" value="' + defaultValue.replace(/"/g, '&quot;') + '">'
      + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">'
      + '<button id="modal-cancel" style="padding:7px 18px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--fg);cursor:pointer;font-size:12.5px;font-family:inherit">取消</button>'
      + '<button id="modal-confirm" style="padding:7px 18px;border:none;border-radius:var(--radius-sm);background:var(--accent);color:#fff;cursor:pointer;font-size:12.5px;font-family:inherit">确定</button>'
      + '</div>';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    const input = document.getElementById('modal-input');
    input.focus();
    input.select();
    const cleanup = () => { overlay.remove(); };
    document.getElementById('modal-confirm').onclick = () => { const v = input.value; cleanup(); resolve(v); };
    document.getElementById('modal-cancel').onclick = () => { cleanup(); resolve(null); };
    input.onkeydown = (e) => {
      if (e.key === 'Enter') { const v = input.value; cleanup(); resolve(v); }
      if (e.key === 'Escape') { cleanup(); resolve(null); }
    };
  });
}

function showConfirm(title, message) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .15s';
    overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); resolve(false); } };
    const box = document.createElement('div');
    box.style.cssText = 'background:var(--surface);border-radius:var(--radius-lg);padding:24px 28px;width:360px;border:1px solid var(--border);box-shadow:var(--shadow-lg)';
    box.innerHTML = '<div style="margin-bottom:16px"><h2 style="font-size:15px;font-weight:600;color:var(--fg);margin-bottom:4px">' + title + '</h2><p style="font-size:13px;color:var(--fg-secondary)">' + message + '</p></div>'
      + '<div style="display:flex;gap:8px;justify-content:flex-end">'
      + '<button id="modal-cancel" style="padding:7px 18px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--fg);cursor:pointer;font-size:12.5px;font-family:inherit">取消</button>'
      + '<button id="modal-confirm" style="padding:7px 18px;border:none;border-radius:var(--radius-sm);background:#ef4444;color:#fff;cursor:pointer;font-size:12.5px;font-family:inherit">确定</button>'
      + '</div>';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    document.getElementById('modal-confirm').focus();
    const cleanup = () => { overlay.remove(); };
    document.getElementById('modal-confirm').onclick = () => { cleanup(); resolve(true); };
    document.getElementById('modal-cancel').onclick = () => { cleanup(); resolve(false); };
    overlay.onkeydown = (e) => { if (e.key === 'Escape') { cleanup(); resolve(false); } };
  });
}

/* Settings */
function toggleSettings() {
  let panel = document.getElementById('settings-panel');
  if (panel) { panel.remove(); return; }
  panel = document.createElement('div');
  panel.id = 'settings-panel';
  panel.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .15s';
  panel.onclick = (e) => { if(e.target===panel) panel.remove(); };

  const box = document.createElement('div');
  box.style.cssText = 'background:var(--surface);border-radius:var(--radius-lg);padding:28px 32px;width:400px;border:1px solid var(--border);box-shadow:var(--shadow-lg)';

  let html = '<div style="margin-bottom:24px">';
  html += '<h2 style="font-size:16px;font-weight:600;letter-spacing:-0.01em;color:var(--fg);margin-bottom:4px">设置</h2>';
  html += '<p style="font-size:12.5px;color:var(--muted)">配置应用行为和快捷键</p></div>';

  html += '<div style="margin-bottom:20px">';
  html += '<label style="display:block;font-size:12px;font-weight:500;color:var(--fg-secondary);margin-bottom:6px">全局快捷键</label>';
  html += '<div style="position:relative">';
  html += '<input id="s-hotkey" readonly style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);color:var(--fg);font-size:13px;outline:none;cursor:pointer;font-family:inherit" onclick="startHotkeyCapture(this)">';
  html += '</div></div>';

  html += '<div style="margin-bottom:24px">';
  html += '<label style="display:block;font-size:12px;font-weight:500;color:var(--fg-secondary);margin-bottom:6px">同步模式</label>';
  html += '<select id="s-sync" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);color:var(--fg);font-size:13px;outline:none;font-family:inherit;cursor:pointer">';
  html += '<option value="manual">手动同步</option>';
  html += '<option value="on_startup">启动时同步</option>';
  html += '<option value="scheduled">定时同步</option>';
  html += '</select></div>';

  html += '<div style="margin-bottom:24px">';
  html += '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:12.5px;color:var(--fg-secondary);font-weight:500">';
  html += '<input id="s-gif" type="checkbox" style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer">';
  html += 'GIF 动图自动播放</label></div>';

  html += '<div style="display:flex;gap:8px;justify-content:space-between;align-items:center">';
  html += '<button onclick="resetSettings()" style="padding:7px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-family:inherit;transition:all var(--transition)">恢复默认</button>';
  html += '<div style="display:flex;gap:8px">';
  html += '<button onclick="this.closest(\'#settings-panel\').remove()" style="padding:7px 18px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--fg);cursor:pointer;font-size:12.5px;font-family:inherit;transition:all var(--transition)">取消</button>';
  html += '<button onclick="saveSettings()" style="padding:7px 18px;border:none;border-radius:var(--radius-sm);background:var(--accent);color:#fff;cursor:pointer;font-size:12.5px;font-family:inherit;transition:all var(--transition)">保存</button>';
  html += '</div></div>';

  box.innerHTML = html;
  panel.appendChild(box);
  document.body.appendChild(panel);
  getSettings();
}

let hotkeyCapturing = false;
function startHotkeyCapture(input) {
  if (hotkeyCapturing) return;
  hotkeyCapturing = true;
  const prev = input.value;
  input.value = '';
  input.placeholder = '按下快捷键...';
  input.style.borderColor = 'var(--accent)';

  const handler = (e) => {
    e.preventDefault(); e.stopPropagation();
    const parts = [];
    if (e.ctrlKey) parts.push('Ctrl');
    if (e.altKey) parts.push('Alt');
    if (e.shiftKey) parts.push('Shift');
    if (e.metaKey) parts.push('Win');
    const key = e.key;
    if (['Control', 'Alt', 'Shift', 'Meta'].includes(key)) return;
    let mk = key;
    if (mk === ' ') mk = 'Space';
    if (mk.length === 1) mk = mk.toUpperCase();
    parts.push(mk);
    input.value = parts.join('+');
    input.placeholder = '';
    input.style.borderColor = 'var(--border)';
    hotkeyCapturing = false;
    document.removeEventListener('keydown', handler, true);
  };
  document.addEventListener('keydown', handler, true);
}

async function getSettings() {
  const s = await api('get_settings');
  if (!s) return;
  const hk = document.getElementById('s-hotkey');
  const sync = document.getElementById('s-sync');
  const gif = document.getElementById('s-gif');
  if (hk && s.hotkey) hk.value = s.hotkey;
  if (sync && s.sync_mode) sync.value = s.sync_mode;
  if (gif) gif.checked = s.auto_play_gif !== false;
}

async function saveSettings() {
  const hotkey = document.getElementById('s-hotkey')?.value || 'Ctrl+Alt+M';
  const sync = document.getElementById('s-sync')?.value || 'manual';
  const gif = document.getElementById('s-gif')?.checked !== false;
  await api('save_settings', { hotkey, sync_mode: sync, auto_play_gif: gif });
  showToast('设置已保存');
  document.getElementById('settings-panel')?.remove();
  refreshMemes();
}

async function resetSettings() {
  const s = await api('reset_settings');
  if (s) {
    const hk = document.getElementById('s-hotkey');
    const sync = document.getElementById('s-sync');
    const gif = document.getElementById('s-gif');
    if (hk) hk.value = s.hotkey;
    if (sync) sync.value = s.sync_mode;
    if (gif) gif.checked = s.auto_play_gif !== false;
    showToast('已恢复默认设置');
  }
}

/* Toast */
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

function hide() { try { pywebview.api.hide_window(); } catch(e) {} }

/* Window Drag */
let dragState = null;
const titlebar = document.getElementById('titlebar');
titlebar.addEventListener('mousedown', (e) => {
  if (e.target.closest('.title-btn')) return;
  dragState = { sx: e.screenX, sy: e.screenY };
  e.preventDefault();
});
document.addEventListener('mousemove', (e) => {
  if (!dragState) return;
  const dx = e.screenX - dragState.sx, dy = e.screenY - dragState.sy;
  if (dx !== 0 || dy !== 0) {
    api('move_window', dx, dy);
    dragState.sx = e.screenX; dragState.sy = e.screenY;
  }
});
document.addEventListener('mouseup', () => { dragState = null; });

/* Init */
document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('loading').classList.remove('hidden');
  await Promise.all([refreshTags(), refreshMemes(), refreshCollections()]);
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('search').focus();
  // 延迟扫描缓存目录，确保 API 线程准备就绪
  setTimeout(async () => {
    await api('rescan_cache');
    refreshMemes();
    refreshTags();
    refreshCollections();
  }, 1000);
});
</script>
