<head><meta charset="UTF-8"><link rel="stylesheet" href="/floating.css"></head>
<div id="floating-app">
  <div id="floating-titlebar">
    <span>OhMyMeme 快速搜索</span>
    <button id="floating-close" type="button" title="关闭">×</button>
  </div>
  <div id="floating-search-wrap">
    <input id="floating-search" type="text" placeholder="输入关键词搜索表情包..." autocomplete="off" spellcheck="false">
  </div>
  <div id="floating-hint">仅搜索本地表情；不会读取 QQ、微信或其他应用的输入内容</div>
  <div id="floating-grid"></div>
  <div id="floating-empty">没有匹配的表情包</div>
</div>
<script src="/floating.js"></script>
