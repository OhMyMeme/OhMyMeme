name: Build

on:
  workflow_run:
    workflows: ["Check"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: python scripts/build.py --build-only
      - name: Install InnoSetup
        run: |
          choco install innosetup --no-progress
          echo "ISCC_DIR=C:\Program Files (x86)\Inno Setup 6\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build installer
        run: python scripts/build.py --installer-only
      - name: Package contract smoke
        run: python scripts/package_smoke.py --contract-only --target windows-x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OhMyMeme-Windows
          path: dist/OhMyMeme-*-setup.exe

  build-linux:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libgirepository1.0-dev libgirepository-2.0-dev gobject-introspection libcairo2-dev libffi-dev
          pip install -r requirements.txt
          pip install pyinstaller
          pip install PyGObject
      - name: Build Linux packages
        run: python scripts/build.py --linux
      - name: Package contract smoke
        run: python scripts/package_smoke.py --contract-only
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OhMyMeme-Linux
          path: |
            dist/OhMyMeme-v*-x86_64.AppImage
            dist/OhMyMeme-v*-amd64.deb
            dist/OhMyMeme-v*-x86_64.rpm

  build-macos:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build macOS packages (.app + .dmg)
        run: python scripts/build.py --macos --arch ${{ matrix.arch }}
      - name: Package contract smoke
        run: python scripts/package_smoke.py --contract-only --target macos-${{ matrix.arch }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OhMyMeme-macOS-${{ matrix.arch }}
          path: dist/OhMyMeme-v*-${{ matrix.arch }}.dmg
