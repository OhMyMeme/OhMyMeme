name: Build

on:
  workflow_run:
    workflows: ["Check"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: python scripts/build.py --build-only
      - name: Install InnoSetup
        run: |
          choco install innosetup --no-progress
          echo "ISCC_DIR=C:\Program Files (x86)\Inno Setup 6\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build installer
        run: python scripts/build.py --installer-only
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OhMyMeme-Windows
          path: dist/OhMyMeme-*-setup.exe

  build-linux:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Linux packages
        run: python scripts/build.py --linux
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OhMyMeme-Linux
          path: |
            dist/OhMyMeme-v*-x86_64.AppImage
            dist/OhMyMeme-v*-amd64.deb
            dist/OhMyMeme-v*-x86_64.rpm

  build-macos:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build macOS packages (.app + .dmg)
        run: python scripts/build.py --macos
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OhMyMeme-macOS
          path: dist/OhMyMeme-v*-macos.dmg
