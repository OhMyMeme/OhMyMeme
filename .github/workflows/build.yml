name: Build

on:
  workflow_dispatch:

jobs:
  ffmpeg-win64:
    uses: ./.github/workflows/ffmpeg-win64.yml
    with:
      ref: ${{ github.ref }}

  build-windows:
    needs: ffmpeg-win64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-win64
          path: ffmpeg-win64
      - name: Build with PyInstaller
        run: python scripts/build.py --build-only
      - name: Verify bundled wechat_keyfinder helper
        run: python scripts/build.py --verify-helper
      - name: Verify bundled ffmpeg
        run: python scripts/build.py --verify-ffmpeg
      - name: Install InnoSetup
        run: |
          choco install innosetup --no-progress
          echo "ISCC_DIR=C:\Program Files (x86)\Inno Setup 6\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build installers (exe + msix)
        run: python scripts/build.py --installer-only --msix
      - name: Generate sha256.txt
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import os

          patterns = [
              "dist/OhMyMeme-*-setup.exe",
              "dist/OhMyMeme-*.msix",
          ]
          seen = set()
          files = []
          for pattern in patterns:
              for path in sorted(glob.glob(pattern)):
                  if path not in seen:
                      seen.add(path)
                      files.append(path)
          if not files:
              raise SystemExit("ERROR: 未找到待校验的 dist 产物")

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          with open("dist/sha256.txt", "w", encoding="utf-8", newline="\n") as out:
              for path in files:
                  out.write(f"{sha256(path)}  {os.path.basename(path)}\n")
          print(open("dist/sha256.txt", encoding="utf-8").read())
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OhMyMeme-Windows
          path: |
            dist/OhMyMeme-*-setup.exe
            dist/OhMyMeme-*.msix
            dist/sha256.txt

  build-linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-webkit2-4.1 libgirepository1.0-dev libgirepository-2.0-dev gobject-introspection libcairo2-dev libffi-dev
          pip install -r requirements.txt
          pip install pyinstaller
          pip install PyGObject
      - name: Build Linux packages
        run: python scripts/build.py --linux --arch ${{ matrix.arch }}
      - name: Generate sha256.txt
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import os

          patterns = [
              "dist/OhMyMeme-v*-${{ matrix.arch }}.AppImage",
              "dist/OhMyMeme-v*-${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }}.deb",
              "dist/OhMyMeme-v*-${{ matrix.arch }}.rpm",
          ]
          seen = set()
          files = []
          for pattern in patterns:
              for path in sorted(glob.glob(pattern)):
                  if path not in seen:
                      seen.add(path)
                      files.append(path)
          if not files:
              raise SystemExit("ERROR: 未找到待校验的 dist 产物")

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          with open("dist/sha256.txt", "w", encoding="utf-8", newline="\n") as out:
              for path in files:
                  out.write(f"{sha256(path)}  {os.path.basename(path)}\n")
          print(open("dist/sha256.txt", encoding="utf-8").read())
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OhMyMeme-Linux-${{ matrix.arch }}
          path: |
            dist/OhMyMeme-v*-${{ matrix.arch }}.AppImage
            dist/OhMyMeme-v*-${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }}.deb
            dist/OhMyMeme-v*-${{ matrix.arch }}.rpm
            dist/sha256.txt

  build-macos:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build macOS packages (.app + .dmg)
        run: python scripts/build.py --macos --arch ${{ matrix.arch }}
      - name: Generate sha256.txt
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import os

          patterns = [
              "dist/OhMyMeme-v*-${{ matrix.arch }}.dmg",
          ]
          seen = set()
          files = []
          for pattern in patterns:
              for path in sorted(glob.glob(pattern)):
                  if path not in seen:
                      seen.add(path)
                      files.append(path)
          if not files:
              raise SystemExit("ERROR: 未找到待校验的 dist 产物")

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          with open("dist/sha256.txt", "w", encoding="utf-8", newline="\n") as out:
              for path in files:
                  out.write(f"{sha256(path)}  {os.path.basename(path)}\n")
          print(open("dist/sha256.txt", encoding="utf-8").read())
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OhMyMeme-macOS-${{ matrix.arch }}
          path: |
            dist/OhMyMeme-v*-${{ matrix.arch }}.dmg
            dist/sha256.txt
