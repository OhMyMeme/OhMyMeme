name: Build

on:
  workflow_run:
    workflows: ["Check"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: jdx/mise-action@v4
      - name: Bootstrap pip
        run: python -m ensurepip --upgrade
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Build with PyInstaller
        run: python scripts/build.py --build-only
      - name: Install InnoSetup
        run: |
          choco install innosetup --no-progress
          echo "ISCC_DIR=C:\Program Files (x86)\Inno Setup 6\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build installer
        run: python scripts/build.py --installer-only
      - name: Package contract smoke
        run: python -m scripts.package_smoke --contract-only --target windows-x64
      - name: Pack official plugin ZIPs
        run: python scripts/plugin_packaging.py --pack-zips --out dist/plugins
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OhMyMeme-Windows
          path: dist/OhMyMeme-*-setup.exe
      - name: Upload plugin ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: OhMyMeme-Plugins-Windows
          path: dist/plugins/*.zip

  build-linux:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: jdx/mise-action@v4
      - name: Bootstrap pip
        run: python -m ensurepip --upgrade
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-webkit2-4.1 libgirepository1.0-dev libgirepository-2.0-dev gobject-introspection libcairo2-dev libffi-dev
          pip install -r requirements.txt
          pip install pyinstaller
          pip install PyGObject
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Build Linux packages
        run: python scripts/build.py --linux --arch ${{ matrix.arch }}
      - name: Package contract smoke
        run: python -m scripts.package_smoke --contract-only
      - name: Pack official plugin ZIPs
        run: python scripts/plugin_packaging.py --pack-zips --out dist/plugins
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OhMyMeme-Linux-${{ matrix.arch }}
          path: |
            dist/OhMyMeme-v*-${{ matrix.arch }}.AppImage
            dist/OhMyMeme-v*-${{ matrix.arch }}.deb
            dist/OhMyMeme-v*-${{ matrix.arch }}.rpm
      - name: Upload plugin ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: OhMyMeme-Plugins-Linux-${{ matrix.arch }}
          path: dist/plugins/*.zip

  build-macos:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: jdx/mise-action@v4
      - name: Bootstrap pip
        run: python -m ensurepip --upgrade
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Build macOS packages (.app + .dmg)
        run: python scripts/build.py --macos --arch ${{ matrix.arch }}
      - name: Package contract smoke
        run: python -m scripts.package_smoke --contract-only --target macos-${{ matrix.arch }}
      - name: Pack official plugin ZIPs
        run: python scripts/plugin_packaging.py --pack-zips --out dist/plugins
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OhMyMeme-macOS-${{ matrix.arch }}
          path: dist/OhMyMeme-v*-${{ matrix.arch }}.dmg
      - name: Upload plugin ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: OhMyMeme-Plugins-macOS-${{ matrix.arch }}
          path: dist/plugins/*.zip
