name: Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - name: Bootstrap pip
        run: python -m ensurepip --upgrade
      - name: Install dependencies
        run: mise run setup
      - name: Check
        run: mise run check
