name: Nightly

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  ffmpeg-win64:
    if: ${{ github.repository == 'OhMyMeme/OhMyMeme' }}
    uses: ./.github/workflows/ffmpeg-win64.yml
    with:
      ref: dev

  nightly-windows:
    if: ${{ github.repository == 'OhMyMeme/OhMyMeme' }}
    needs: ffmpeg-win64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-win64
          path: ffmpeg-win64
      - name: Build with PyInstaller
        run: python scripts/build.py --build-only --nightly
      - name: Verify bundled wechat_keyfinder helper
        run: python scripts/build.py --verify-helper
      - name: Verify bundled ffmpeg
        run: python scripts/build.py --verify-ffmpeg
      - name: Install InnoSetup
        run: |
          choco install innosetup --no-progress
          echo "ISCC_DIR=C:\Program Files (x86)\Inno Setup 6\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build installers (exe + msix)
        run: python scripts/build.py --installer-only --nightly --msix
      - name: Generate sha256.txt
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import os

          patterns = [
              "dist/OhMyMeme-nightly-setup.exe",
              "dist/OhMyMeme-nightly.msix",
          ]
          seen = set()
          files = []
          for pattern in patterns:
              for path in sorted(glob.glob(pattern)):
                  if path not in seen:
                      seen.add(path)
                      files.append(path)
          if not files:
              raise SystemExit("ERROR: 未找到待校验的 dist 产物")

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          with open("dist/sha256.txt", "w", encoding="utf-8", newline="\n") as out:
              for path in files:
                  out.write(f"{sha256(path)}  {os.path.basename(path)}\n")
          print(open("dist/sha256.txt", encoding="utf-8").read())
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-windows
          path: |
            dist/OhMyMeme-nightly-setup.exe
            dist/OhMyMeme-nightly.msix
            dist/sha256.txt

  nightly-linux:
    if: ${{ github.repository == 'OhMyMeme/OhMyMeme' }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-webkit2-4.1 libgirepository1.0-dev libgirepository-2.0-dev gobject-introspection libcairo2-dev libffi-dev
          pip install -r requirements.txt
          pip install pyinstaller
          pip install PyGObject
      - name: Build Linux nightly
        run: python scripts/build.py --linux --nightly --arch ${{ matrix.arch }}
      - name: Generate sha256.txt
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import os

          patterns = [
              "dist/OhMyMeme-v*-${{ matrix.arch }}.AppImage",
              "dist/OhMyMeme-v*-${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }}.deb",
              "dist/OhMyMeme-v*-${{ matrix.arch }}.rpm",
          ]
          seen = set()
          files = []
          for pattern in patterns:
              for path in sorted(glob.glob(pattern)):
                  if path not in seen:
                      seen.add(path)
                      files.append(path)
          if not files:
              raise SystemExit("ERROR: 未找到待校验的 dist 产物")

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          with open("dist/sha256.txt", "w", encoding="utf-8", newline="\n") as out:
              for path in files:
                  out.write(f"{sha256(path)}  {os.path.basename(path)}\n")
          print(open("dist/sha256.txt", encoding="utf-8").read())
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-linux-${{ matrix.arch }}
          path: |
            dist/OhMyMeme-v*-${{ matrix.arch }}.AppImage
            dist/OhMyMeme-v*-${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }}.deb
            dist/OhMyMeme-v*-${{ matrix.arch }}.rpm
            dist/sha256.txt

  nightly-macos:
    if: ${{ github.repository == 'OhMyMeme/OhMyMeme' }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build macOS nightly (.app + .dmg)
        run: python scripts/build.py --macos --nightly --arch ${{ matrix.arch }}
      - name: Generate sha256.txt
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import os

          patterns = [
              "dist/OhMyMeme-v*-${{ matrix.arch }}.dmg",
          ]
          seen = set()
          files = []
          for pattern in patterns:
              for path in sorted(glob.glob(pattern)):
                  if path not in seen:
                      seen.add(path)
                      files.append(path)
          if not files:
              raise SystemExit("ERROR: 未找到待校验的 dist 产物")

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          with open("dist/sha256.txt", "w", encoding="utf-8", newline="\n") as out:
              for path in files:
                  out.write(f"{sha256(path)}  {os.path.basename(path)}\n")
          print(open("dist/sha256.txt", encoding="utf-8").read())
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-macos-${{ matrix.arch }}
          path: |
            dist/OhMyMeme-v*-${{ matrix.arch }}.dmg
            dist/sha256.txt

  publish-nightly:
    if: ${{ github.repository == 'OhMyMeme/OhMyMeme' }}
    needs: [nightly-windows, nightly-linux, nightly-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate sha256.txt
        run: |
          python3 - <<'PY'
          import hashlib
          import os

          root = "artifacts"
          files = sorted(
              os.path.join(dp, name)
              for dp, _dirs, names in os.walk(root)
              for name in names
              if name != "sha256.txt"
          )
          if not files:
              raise SystemExit("ERROR: artifacts 中没有可校验的文件")

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          with open(os.path.join(root, "sha256.txt"), "w", encoding="utf-8", newline="\n") as out:
              for path in files:
                  out.write(f"{sha256(path)}  {os.path.basename(path)}\n")
          print(open(os.path.join(root, "sha256.txt"), encoding="utf-8").read())
          PY
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --repo OhMyMeme/OhMyMeme --yes 2>/dev/null || true
          gh release create nightly --repo OhMyMeme/OhMyMeme --prerelease \
            --title "Nightly Build ($(date -u +'%Y-%m-%d'))" \
            --notes "# 非正式版（Nightly Build）

          > **注意：这是非正式测试版本，仅供开发者和高级用户测试使用！**
          >
          > - 可能存在未知 Bug 或未完成功能，请勿用于生产环境
          > - 不代表最终发布质量，功能与界面可能随时变动
          > - 软件内的更新检查 **不会** 提示此版本，请勿将其用于日常更新路径
          >
          > 正式版请从 [Releases](https://github.com/OhMyMeme/OhMyMeme/releases) 下载。"
          gh release upload nightly --repo OhMyMeme/OhMyMeme artifacts/* --clobber
