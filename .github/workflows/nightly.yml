name: Nightly

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  nightly-windows:
    if: ${{ github.repository == 'OhMyMeme/OhMyMeme' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Bootstrap pip
        run: python -m ensurepip --upgrade
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Build with PyInstaller
        run: python scripts/build.py --build-only --nightly
      - name: Install InnoSetup
        run: |
          choco install innosetup --no-progress
          echo "ISCC_DIR=C:\Program Files (x86)\Inno Setup 6\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build installer
        run: python scripts/build.py --installer-only --nightly
      - name: Package contract smoke
        run: python -m scripts.package_smoke --contract-only --channel nightly --target windows-x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-windows
          path: dist/OhMyMeme-nightly-setup.exe

  nightly-linux:
    if: ${{ github.repository == 'OhMyMeme/OhMyMeme' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Bootstrap pip
        run: python -m ensurepip --upgrade
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libgirepository1.0-dev libgirepository-2.0-dev gobject-introspection libcairo2-dev libffi-dev
          pip install -r requirements.txt
          pip install pyinstaller
          pip install PyGObject
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Build Linux nightly
        run: python scripts/build.py --linux --nightly
      - name: Package contract smoke
        run: python -m scripts.package_smoke --contract-only --channel nightly
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-linux
          path: |
            dist/OhMyMeme-v*-x86_64.AppImage
            dist/OhMyMeme-v*-amd64.deb
            dist/OhMyMeme-v*-x86_64.rpm

  nightly-macos:
    if: ${{ github.repository == 'OhMyMeme/OhMyMeme' }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Bootstrap pip
        run: python -m ensurepip --upgrade
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Build macOS nightly (.app + .dmg)
        run: python scripts/build.py --macos --nightly --arch ${{ matrix.arch }}
      - name: Package contract smoke
        run: python -m scripts.package_smoke --contract-only --channel nightly --target macos-${{ matrix.arch }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-macos-${{ matrix.arch }}
          path: dist/OhMyMeme-v*-${{ matrix.arch }}.dmg

  publish-nightly:
    if: ${{ github.repository == 'OhMyMeme/OhMyMeme' }}
    needs: [nightly-windows, nightly-linux, nightly-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --repo OhMyMeme/OhMyMeme --yes 2>/dev/null || true
          gh release create nightly --repo OhMyMeme/OhMyMeme --prerelease \
            --title "Nightly Build ($(date -u +'%Y-%m-%d'))" \
            --notes "$(cat <<'EOF'
          # 非正式版（Nightly Build）

          > **注意：这是非正式测试版本，仅供开发者和高级用户测试使用！**
          >
          > - 可能存在未知 Bug 或未完成功能，请勿用于生产环境
          > - 不代表最终发布质量，功能与界面可能随时变动
          > - 软件内的更新检查 **不会** 提示此版本，请勿将其用于日常更新路径
          >
          > 正式版请从 [Releases](https://github.com/OhMyMeme/OhMyMeme/releases) 下载。
          EOF
          )"
          gh release upload nightly --repo OhMyMeme/OhMyMeme artifacts/* --clobber
